<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gryt is open-source voice, video and text chat. Download the app and you can make your own server right from it. Build your client." />
    <meta name="theme-color" content="#111318" />
    <meta name="keywords" content="voice chat, WebRTC, self-hosted, open source, real-time communication, video chat, text chat" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gryt | Voice, Text & Video Chat" />
    <meta property="og:description" content="Gryt is open-source voice, video and text chat. Download the app and you can make your own server right from it. Build your client." />
    <meta property="og:image" content="https://gryt.chat/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:url" content="https://gryt.chat" />
    <meta property="og:site_name" content="Gryt" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gryt | Voice, Text & Video Chat" />
    <meta name="twitter:description" content="Open-source voice, video and text chat. The app you download can host your server too." />
    <meta name="twitter:image" content="https://gryt.chat/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <link rel="preload" as="image" href="/logo.svg" />
    <!--
      The hero's first frame. `Clip` renders it as the `poster` of the video,
      and as a plain `img` under prefers-reduced-motion, so it is what paints
      first either way and preloading it is worth the priority.

      One file, no srcset. The three responsive stills this used to name —
      client-sm, client-md and client.webp — were deleted in GRYT-640 when the
      front page became a clip, and this link went on asking for the first of
      them: a 404 on every visit to gryt.chat, quietly, since then.

      `prerender-blog.mjs` strips this on every other page, which is what the
      data attribute is for.
    -->
    <link
      data-home-preload
      rel="preload"
      as="image"
      href="/home/client-live.poster.webp"
      fetchpriority="high"
    />
    <link rel="me" href="https://mastodon.social/@gryt" />
    <meta name="fediverse:creator" content="@gryt@mastodon.social" />
    <link rel="canonical" href="https://gryt.chat" />
    <title>Gryt | Voice, Text & Video Chat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
