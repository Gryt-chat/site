name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matching the Dockerfile rather than the newest Node, so a build that
          # passes here is a build that passes in the image.
          node-version: 22
          cache: yarn
      # yarn, because that is what the Dockerfile installs with. The package-lock.json here
      # is a known wart and not this file's to sort out.
      - run: yarn install --frozen-lockfile

      - run: yarn lint

      # Code here is TypeScript so its types get checked (GRYT-1800). A file that has to stay
      # JavaScript goes in .js-allowlist, one path a line, with a # comment saying why.
      - name: No new JavaScript
        run: |
          allowed=$(grep -v '^#' .js-allowlist 2>/dev/null || true)
          found=$(git ls-files '*.js' '*.mjs' '*.cjs' '*.jsx' | grep -vxF -e "$allowed" -e '' || true)
          if [ -n "$found" ]; then
            echo "::error::JavaScript not on .js-allowlist. Write it in TypeScript (GRYT-1800):"
            echo "$found"
            exit 1
          fi

      # The scripts, pages.ts and the lint config. `tsc -b` in the build covers src only.
      - run: npx tsc -p scripts

      # No comment runs past two lines. The script carries the list of paths still
      # to be swept, and that list only ever shrinks.
      - run: yarn test:comment-length

      # Runs Clip.tsx's own observer callback. A clip that plays on load rather than
      # on arrival is the bug this had, and autoPlay coming back is how it returns.
      - run: yarn test:clips

      # The shape the client reads to say what changed after an update. A field
      # going missing here is a modal that never opens, and nothing else notices.
      - run: yarn test:changelog-json
      - run: yarn test:changelog-kinds
      - run: yarn test:link-underline
      - run: yarn test:changelog-lines

      # A phone read as a Mac or as Linux was handed a .dmg or an AppImage. Imports the
      # TypeScript directly, which Node 22 strips without a flag.
      - run: yarn test:detect-os

      # The sitemap check, run against small fake sites that each break one rule. The real
      # check runs inside `yarn build` below.
      - run: yarn test:sitemap
      - run: yarn test:support-search

      # tsc -b, the image optimiser, vite build, the blog prerender and the meta check. The
      # last fails the build on a page missing its metadata, so this is more than a compile.
      - run: yarn build

      # The built pages in the runner's Chrome, as a visitor west of UTC and on a phone. Any
      # React hydration error fails it, which is what #418 on every page was.
      - run: yarn test:hydration

  # gryt.chat is this Dockerfile. Its own job, because the image installs
  # everything it needs and has nothing to take from the one above.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
