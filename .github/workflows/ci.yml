name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matching the Dockerfile rather than the newest Node, so a build that
          # passes here is a build that passes in the image.
          node-version: 22
          cache: yarn
      # yarn, because that is what the Dockerfile installs with. The package-lock.json here
      # is a known wart and not this file's to sort out.
      - run: yarn install --frozen-lockfile

      - run: yarn lint

      # No comment runs past two lines. The script carries the list of paths still
      # to be swept, and that list only ever shrinks.
      - run: yarn test:comment-length

      # Runs Clip.tsx's own observer callback. A clip that plays on load rather than
      # on arrival is the bug this had, and autoPlay coming back is how it returns.
      - run: yarn test:clips

      # tsc -b, the image optimiser, vite build, the blog prerender and the meta check. The
      # last fails the build on a page missing its metadata, so this is more than a compile.
      - run: yarn build

  # gryt.chat is this Dockerfile. Its own job, because the image installs
  # everything it needs and has nothing to take from the one above.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
